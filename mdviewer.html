<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary SEO Meta Tags -->
  <title>MeowMD Viewer — Offline Technical Markdown Documentation Workspace</title>
  <meta name="title" content="MeowMD Viewer — Offline Technical Markdown Documentation Workspace">
  <meta name="description"
    content="Upload or paste Markdown files and folders to view beautifully rendered HTML with Mermaid charts, LaTeX math, 3D molecules, and PDF export. 100% offline & private.">
  <meta name="keywords"
    content="markdown viewer, offline markdown reader, technical documentation viewer, render markdown online, markdown mermaid, markdown latex math, markdown 3dmol">
  <meta name="author" content="MeowMD">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://atharvatilewale.github.io/meowmd/mdviewer.html">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://atharvatilewale.github.io/meowmd/mdviewer.html">
  <meta property="og:title" content="MeowMD Viewer — Technical Markdown Workspace">
  <meta property="og:description"
    content="Render and explore Markdown documentation with diagrams, math, 3D molecule support, and multi-file search.">
  <meta property="og:image" content="https://atharvatilewale.github.io/meowmd/og-image.png">

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://atharvatilewale.github.io/meowmd/mdviewer.html">
  <meta name="twitter:title" content="MeowMD Viewer — Technical Markdown Workspace">
  <meta name="twitter:description"
    content="Render and explore Markdown documentation with diagrams, math, and multi-file search.">
  <meta name="twitter:image" content="https://atharvatilewale.github.io/meowmd/og-image.png">

  <!-- PWA Manifest & Theme -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#fafafa">
  <link rel="apple-touch-icon" href="assets/img/icon.svg">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">

  <!-- Resource Hints -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">

  <!-- Google Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- App Stylesheets -->
  <link rel="stylesheet" href="assets/css/core.css">
  <link rel="stylesheet" href="assets/css/viewer.css">

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "MeowMD Viewer",
    "url": "https://atharvatilewale.github.io/meowmd/mdviewer.html",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "All",
    "description": "A local, offline-capable technical markdown viewer with structural biology, charts, math, and diagram plotting support."
  }
  </script>
</head>

<body>

  <!-- Navigation Bar -->
  <header>
    <nav class="navbar" aria-label="Main Navigation">
      <a href="https://atharvatilewale.github.io/meowmd/" class="logo" aria-label="MeowMD Home">
        <span class="logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><rect class="brand-tile" width="32" height="32" rx="9"/><path class="brand-mark" d="M8 23.5V10.5l8 7.2 8-7.2v8.3c0 3.4-2.1 5.2-4.6 5.2-1.6 0-2.8-.8-3.4-2.1" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        MeowMD
      </a>

      <div class="nav-links">
        <a href="https://atharvatilewale.github.io/meowmd/" class="nav-link nav-link-home">Home</a>
        <a href="mdviewer.html" class="nav-link active">MD Viewer</a>
        <a href="mdeditor.html" class="nav-link">MD Editor</a>
        <button class="btn-icon theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Theme">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>
    </nav>
  </header>

  <!-- Workspace Container -->
  <div class="app-container">

    <!-- Workspace Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Workspace Files">
      <div class="sidebar-header">
        <div class="sidebar-branding">
          <span>Workspace</span>
          <button class="btn-icon" id="toggleSidebarBtn" title="Close Sidebar" aria-label="Close Sidebar">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="Search documents" aria-label="Search documents" />
        </div>

        <div class="sidebar-actions">
          <label for="fileInput" class="btn btn-primary" title="Import Markdown Files">Files</label>
          <label for="folderInput" class="btn btn-outline" title="Import Whole Folder">Folder</label>
          <button class="btn btn-danger" id="clearAllBtn" title="Clear Workspace" aria-label="Clear Workspace">
            <i class="fa-solid fa-trash-can"></i>
          </button>
          <input type="file" id="fileInput" accept=".md,.markdown,.txt" multiple />
          <input type="file" id="folderInput" webkitdirectory directory multiple />
        </div>

        <div class="storage-toggle-bar">
          <span>Auto-save locally</span>
          <label class="switch" title="Toggle Local Auto-Save">
            <input type="checkbox" id="storageToggle" aria-label="Toggle Auto-Save">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <ul class="file-list" id="fileList"></ul>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content" id="mainContent">

      <!-- Drag and Drop Overlay -->
      <div class="drag-overlay" id="dragOverlay">
        <div class="drag-overlay-content">
          <h2>Drop to import</h2>
          <p>Release to add these files to your workspace</p>
        </div>
      </div>

      <!-- Viewer Top Bar -->
      <div class="viewer-topbar" id="topBar">
        <div class="doc-info">
          <button class="btn-icon" id="sidebarToggleTopbarBtn" title="Toggle Sidebar" aria-label="Toggle Sidebar">
            <i class="fa-solid fa-bars-staggered"></i>
          </button>
          <div class="doc-title" id="docTitle">Loading</div>
          <div class="doc-meta" id="docMeta"></div>
        </div>

        <div class="viewer-actions">
          <button class="btn btn-outline" id="copyRawMdBtn" title="Copy Raw Markdown">
            <i class="fa-regular fa-copy"></i> <span>Copy MD</span>
          </button>
          <button class="btn btn-outline" id="copyHtmlBtn" title="Copy Rendered HTML">
            <i class="fa-solid fa-code"></i> <span>Copy HTML</span>
          </button>
          <button class="btn btn-primary" id="exportPdfBtn" title="Export as PDF">
            <i class="fa-solid fa-arrow-down"></i> <span>Export PDF</span>
          </button>
          <button class="btn-icon" id="printDocBtn" title="Print Document" aria-label="Print Document">
            <i class="fa-solid fa-print"></i>
          </button>
          <button class="btn-icon" id="fullScreenBtn" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
            <i class="fa-solid fa-expand"></i>
          </button>
        </div>
      </div>

      <!-- Markdown Render Viewport -->
      <div class="content-scroll" id="contentScroll">
        <article class="markdown-body" id="markdownContent"></article>
      </div>
    </main>
  </div>

  <!-- Performance Optimized Scripts (Deferred & Lazy Loaded) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/13.0.2/markdown-it.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it-footnote/3.0.3/markdown-it-footnote.min.js"
    defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.5/purify.min.js" defer></script>
  <script src="assets/js/common.js" defer></script>
  <script src="assets/js/lazy-loader.js" defer></script>
  <script src="assets/js/viewer.js" defer></script>
  <script src="assets/js/sw-register.js" defer></script>
</body>

</html>
