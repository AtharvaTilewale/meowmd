<html lang="en">

<head>
  <meta charset="UTF-8">

    content="Render and explore Markdown documentation with diagrams, math, 3D molecule support, and multi-file search.">

  <link rel="manifest" href="manifest.json">

  <link rel="icon" type="image/svg+xml"

  <!-- Resource Hints -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">

  <!-- Google Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">

  <!-- App Stylesheets -->
  <link rel="stylesheet" href="assets/css/core.css">
  <link rel="stylesheet" href="assets/css/viewer.css">

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "MeowMD Viewer",
    "url": "https://atharvatilewale.github.io/meowmd/mdviewer.html",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "All",
    "description": "A local, offline-capable technical markdown viewer with structural biology, charts, math, and diagram plotting support."
  }
  </script>
</head>

<body>

  <!-- Navigation Bar -->
  <header>
    <nav class="navbar" aria-label="Main Navigation">
      <a href="https://atharvatilewale.github.io/meowmd/" class="logo" aria-label="MeowMD Home">
        <span class="logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M12 5c.67 0 1.35.09 2 .26 1.78-2 5.03-2.84 6.42-2.26 1.4.58-.42 7-.42 7 .57 1.07.97 2.3.97 3.65 0 5.64-4.04 10.35-9 10.35S3 19.29 3 13.65c0-1.35.4-2.58.97-3.65 0 0-1.82-6.42-.42-7 1.39-.58 4.64.26 6.42 2.26.65-.17 1.33-.26 2-.26z">
            </path>
          </svg>
        </span>
        MeowMD
      </a>

      <div class="nav-links">
        <a href="https://atharvatilewale.github.io/meowmd/" class="nav-link">Home</a>
        <a href="mdviewer.html" class="nav-link active">MD Viewer</a>
        <a href="mdeditor.html" class="nav-link">MD Generator</a>
        <button class="btn-icon theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Theme">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>
    </nav>
  </header>

  <!-- Workspace Container -->
  <div class="app-container">

    <!-- Workspace Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Workspace Files">
      <div class="sidebar-header">
        <div class="sidebar-branding">
          <span><i class="fa-solid fa-folder-open" style="color: var(--primary);"></i> Workspace</span>
          <div style="display: flex; gap: 0.25rem;">
            <button class="btn-icon" id="toggleSidebarBtn" title="Close Sidebar" aria-label="Close Sidebar">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>

        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="Search documents..." aria-label="Search documents" />
        </div>

        <div class="sidebar-actions">
          <label for="fileInput" class="btn btn-primary" title="Import Markdown Files">
            <i class="fa-solid fa-file-import"></i> Files
          </label>
          <label for="folderInput" class="btn btn-outline" title="Import Whole Folder">
            <i class="fa-solid fa-folder-tree"></i> Folder
          </label>
          <button class="btn btn-danger" id="clearAllBtn" title="Clear Workspace" aria-label="Clear Workspace">
            <i class="fa-solid fa-trash-can"></i>
          </button>
          <input type="file" id="fileInput" accept=".md,.markdown,.txt" multiple />
          <input type="file" id="folderInput" webkitdirectory directory multiple />
        </div>

        <div class="storage-toggle-bar">
          <span><i class="fa-solid fa-hard-drive"></i> Local Auto-Save</span>
          <label class="switch" title="Toggle Local Auto-Save">
            <input type="checkbox" id="storageToggle" aria-label="Toggle Auto-Save">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <ul class="file-list" id="fileList"></ul>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content" id="mainContent">

      <!-- Drag and Drop Overlay -->
      <div class="drag-overlay" id="dragOverlay">
        <div class="drag-overlay-content">
          <h2><i class="fa-solid fa-cloud-arrow-up"></i> Drop to Import</h2>
          <p>Release your Markdown files or folder to instantly add to workspace</p>
        </div>
      </div>

      <!-- Viewer Top Bar -->
      <div class="viewer-topbar" id="topBar">
        <div class="doc-info">
          <button class="btn-icon" id="sidebarToggleTopbarBtn" title="Toggle Sidebar" aria-label="Toggle Sidebar">
            <i class="fa-solid fa-bars-staggered"></i>
          </button>
          <div class="doc-title" id="docTitle">Loading Document...</div>
          <div class="doc-meta" id="docMeta"></div>
        </div>

        <div class="viewer-actions">
          <button class="btn btn-outline" id="copyRawMdBtn" title="Copy Raw Markdown">
            <i class="fa-regular fa-copy"></i> Raw MD
          </button>
          <button class="btn btn-outline" id="copyHtmlBtn" title="Copy Rendered HTML">
            <i class="fa-solid fa-code"></i> HTML
          </button>
          <button class="btn btn-primary" id="exportPdfBtn" title="Export as Clean PDF">
            <i class="fa-solid fa-file-pdf"></i> PDF
          </button>
          <button class="btn-icon" id="printDocBtn" title="Print Document" aria-label="Print Document">
            <i class="fa-solid fa-print"></i>
          </button>
          <button class="btn-icon" id="fullScreenBtn" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
            <i class="fa-solid fa-expand"></i>
          </button>
        </div>
      </div>

      <!-- Markdown Render Viewport -->
      <div class="content-scroll" id="contentScroll">
        <article class="markdown-body" id="markdownContent"></article>
      </div>
    </main>
  </div>

  <!-- Performance Optimized Scripts (Deferred & Lazy Loaded) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/13.0.2/markdown-it.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it-footnote/3.0.3/markdown-it-footnote.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.5/purify.min.js" defer></script>
  <script src="assets/js/common.js" defer></script>
  <script src="assets/js/lazy-loader.js" defer></script>
  <script src="assets/js/viewer.js" defer></script>
  <script src="assets/js/sw-register.js" defer></script>
</body>

</html>
