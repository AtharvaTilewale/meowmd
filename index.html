<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Documentation Server</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    
    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Markdown & Core Rendering Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/13.0.2/markdown-it.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it-footnote/3.0.3/markdown-it-footnote.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.5/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.4.0/dist/mermaid.min.js"></script>
    
    <!-- MathJax 3 Configuration & Dependency -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            svg: {
                fontCache: 'global'
            },
            startup: {
                typeset: false // Manual typesetting so it syncs perfectly with file swapping
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    
    <!-- Advanced Visualization & Search Dependencies -->
    <script src="https://3Dmol.csb.pitt.edu/build/3Dmol-min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>

    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --primary-light: #eff6ff;
            --primary-border: #bfdbfe;
            --bg-app: #f8fafc;
            --bg-panel: #ffffff;
            --bg-hover: #f1f5f9;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --danger-light: #fef2f2;
            
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'Fira Code', monospace;
            --radius: 8px;
            --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 10px 15px -3px rgb(0 0 0 / 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-app);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* App Container */
        .app-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        .main-layout { display: flex; flex: 1; overflow: hidden; position: relative; }

        /* Sidebar Styles */
        .sidebar {
            width: 300px; background-color: var(--bg-panel); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; flex-shrink: 0; z-index: 10; transition: transform 0.3s ease;
        }
        .sidebar.collapsed { transform: translateX(-100%); position: absolute; height: 100%; }

        .sidebar-header { padding: 1.5rem 1rem; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 1rem; }
        
        .sidebar-title {
            font-size: 0.9rem; font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.5px; display: flex; justify-content: space-between; align-items: center;
        }

        /* Search Box */
        .search-box { position: relative; width: 100%; }
        .search-box input {
            width: 100%; padding: 0.5rem 0.75rem 0.5rem 2.2rem; border: 1px solid var(--border-color);
            border-radius: var(--radius); font-family: var(--font-sans); font-size: 0.85rem;
            outline: none; transition: border-color 0.2s; background-color: var(--bg-app); color: var(--text-main);
        }
        .search-box input:focus { border-color: var(--primary); }
        .search-box i { position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.85rem; }

        .upload-input-wrapper { display: flex; gap: 0.5rem; }
        .upload-input-label {
            flex: 1; padding: 0.6rem 0.75rem; background-color: var(--primary); color: white;
            border-radius: var(--radius); font-weight: 600; cursor: pointer; transition: background-color 0.3s;
            text-align: center; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 0.4rem;
        }
        .upload-input-label:hover { background-color: var(--primary-hover); }

        .clear-all-btn {
            padding: 0.6rem 0.75rem; background-color: transparent; color: var(--danger);
            border: 1px solid var(--border-color); border-radius: var(--radius); cursor: pointer;
            font-weight: 600; transition: all 0.3s; font-size: 0.85rem;
        }
        .clear-all-btn:hover:not(:disabled) { background-color: var(--danger-light); border-color: var(--danger); }
        .clear-all-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        input[type="file"] { display: none; }

        .sidebar-content { flex: 1; overflow-y: auto; padding: 0.5rem; }
        .file-list { list-style: none; }
        .file-item {
            padding: 0.75rem; margin-bottom: 0.5rem; background-color: var(--bg-app); border: 1px solid transparent;
            border-radius: var(--radius); cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
        }
        .file-item:hover { background-color: var(--bg-hover); border-color: var(--border-color); }
        .file-item.active { background-color: var(--primary-light); border-color: var(--primary-border); color: var(--primary-hover); font-weight: 600; }
        .file-item-name { flex: 1; font-size: 0.9rem; word-break: break-word; display: flex; align-items: center; gap: 0.5rem; }
        .file-item-icon { flex-shrink: 0; font-size: 1rem; color: var(--text-muted); }
        .file-item.active .file-item-icon { color: var(--primary); }
        .file-item-delete {
            flex-shrink: 0; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem;
            padding: 0.2rem; display: flex; align-items: center; opacity: 0; transition: opacity 0.2s, color 0.2s; border-radius: 4px;
        }
        .file-item:hover .file-item-delete { opacity: 1; }
        .file-item-delete:hover { color: var(--danger); background-color: var(--danger-light); }
        .empty-sidebar { padding: 2rem 1rem; text-align: center; color: var(--text-muted); font-size: 0.9rem; }

        /* Top Bar & Content Area */
        .content-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .top-bar {
            height: 60px; background-color: var(--bg-panel); border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; flex-shrink: 0; z-index: 5;
        }
        .top-bar-left { display: flex; align-items: center; gap: 1rem; }
        .btn-icon {
            background: var(--bg-app); border: 1px solid var(--border-color); color: var(--text-muted);
            cursor: pointer; font-size: 1.1rem; border-radius: 8px; width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .btn-icon:hover { color: var(--primary); border-color: var(--primary); background-color: var(--primary-light); }
        .file-info { font-weight: 500; color: var(--text-muted); font-size: 0.95rem; }
        .viewer-container { flex: 1; overflow-y: auto; padding: 2.5rem; background-color: var(--bg-app); position: relative; }

        /* Upload Drop Zone */
        .upload-zone {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; max-width: 650px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 3rem; text-align: center; border: 2px dashed var(--primary-border); background-color: var(--primary-light);
            border-radius: var(--radius); cursor: pointer; transition: all 0.3s;
        }
        .upload-zone:hover, .upload-zone.drag-over { border-color: var(--primary); transform: translate(-50%, -50%) scale(1.01); }
        .upload-icon { font-size: 4rem; margin-bottom: 1.2rem; }
        .upload-zone h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.5rem; color: #0f172a; }
        .upload-zone p { color: var(--text-muted); margin-bottom: 0.5rem; font-size: 0.95rem; }
        .upload-hint { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.75rem; }

        /* Markdown Viewer Styles */
        .markdown-viewer {
            max-width: 850px; margin: 0 auto; padding: 3rem 4rem; background-color: var(--bg-panel);
            border-radius: 12px; box-shadow: var(--shadow-sm); display: none; font-size: 1.05rem; line-height: 1.8;
        }
        .markdown-viewer.active { display: block; }
        
        .markdown-viewer h1 { font-size: 2.2rem; font-weight: 700; margin: 2rem 0 1.2rem 0; color: #0f172a; border-bottom: 2px solid var(--border-color); padding-bottom: 0.6rem; }
        .markdown-viewer h2 { font-size: 1.6rem; font-weight: 700; margin: 2rem 0 1rem 0; color: #0f172a; border-bottom: 1px solid var(--border-color); padding-bottom: 0.4rem; }
        .markdown-viewer h3 { font-size: 1.3rem; font-weight: 600; margin: 1.5rem 0 0.75rem 0; color: #0f172a; }
        .markdown-viewer p { margin-bottom: 1.25rem; color: var(--text-main); }
        .markdown-viewer a { color: var(--primary); text-decoration: none; transition: color 0.2s; }
        .markdown-viewer a:hover { text-decoration: underline; }
        .markdown-viewer ul, .markdown-viewer ol { margin-left: 1.5rem; margin-bottom: 1.25rem; }
        .markdown-viewer li { margin-bottom: 0.5rem; }
        
        .markdown-viewer code {
            font-family: var(--font-mono); background-color: var(--bg-hover); padding: 0.2em 0.4em;
            border-radius: 4px; font-size: 0.85em; color: #db2777; border: 1px solid var(--border-color);
        }

        /* Code Block Wrapper & Copy Button */
        .code-wrapper { position: relative; margin: 1.5rem 0; }
        .copy-code-btn {
            position: absolute; top: 0.5rem; right: 0.5rem; background: var(--bg-panel);
            border: 1px solid var(--border-color); border-radius: 6px; padding: 0.3rem 0.6rem;
            color: var(--text-muted); cursor: pointer; opacity: 0; transition: opacity 0.2s; font-size: 0.8rem; z-index: 2;
        }
        .code-wrapper:hover .copy-code-btn { opacity: 1; }
        .copy-code-btn:hover { color: var(--primary); border-color: var(--primary); }

        .markdown-viewer pre {
            background-color: #f8fafc; padding: 1.25rem; border-radius: var(--radius);
            overflow-x: auto; margin: 0; border: 1px solid var(--border-color);
        }
        .markdown-viewer pre code { background-color: transparent; color: inherit; padding: 0; font-size: 0.9rem; border: none; }
        
        .markdown-viewer blockquote {
            border-left: 4px solid var(--primary); padding: 1rem 1.25rem; margin: 1.5rem 0;
            color: var(--text-muted); background-color: var(--primary-light); border-radius: 0 var(--radius) var(--radius) 0;
        }

        .markdown-viewer img { max-width: 100%; height: auto; border-radius: var(--radius); margin: 1.5rem 0; border: 1px solid var(--border-color); }

        /* Tables */
        .markdown-viewer table {
            display: block; width: 100%; max-width: 100%; overflow-x: auto; white-space: nowrap;
            border-collapse: collapse; margin: 1.5rem 0; font-size: 0.95em;
        }
        .markdown-viewer table th { padding: 0.75rem 1rem; text-align: left; font-weight: 600; background-color: var(--bg-hover); border: 1px solid var(--border-color); color: #0f172a; }
        .markdown-viewer table td { padding: 0.75rem 1rem; border: 1px solid var(--border-color); }
        .markdown-viewer hr { border: none; border-top: 1px solid var(--border-color); margin: 2rem 0; }

        /* MathJax Scroll Fix */
        mjx-container { overflow-x: auto; overflow-y: hidden; max-width: 100%; padding-bottom: 5px; }

        /* Custom Viz Containers */
        .mol-viewer-container { height: 400px; border-radius: var(--radius); border: 1px solid var(--border-color); margin: 1.5rem 0; overflow: hidden; position: relative; background-color: #f8fafc; }
        .chart-container { margin: 1.5rem 0; padding: 1rem; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: var(--radius); height: 350px; }

        /* Table of Contents (ToC) Sidebar */
        .toc-sidebar {
            width: 240px; background-color: var(--bg-panel); border-left: 1px solid var(--border-color);
            display: flex; flex-direction: column; flex-shrink: 0; padding: 1.5rem; overflow-y: auto; display: none;
        }
        .toc-title { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 1rem; }
        .toc-list { list-style: none; display: flex; flex-direction: column; gap: 0.4rem; }
        .toc-link { text-decoration: none; color: var(--text-main); font-size: 0.85rem; transition: color 0.2s; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .toc-link:hover { color: var(--primary); }
        .toc-h2 { padding-left: 0.75rem; color: var(--text-muted); }
        .toc-h3 { padding-left: 1.5rem; font-size: 0.8rem; color: var(--text-muted); }

        .mermaid { background-color: #ffffff; padding: 1.5rem; border-radius: var(--radius); border: 1px solid var(--border-color); display: flex; justify-content: center; margin: 1.5rem 0; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @media (max-width: 768px) {
            .sidebar { width: 100%; max-height: 30vh; border-right: none; border-bottom: 1px solid var(--border-color); }
            .main-layout { flex-direction: column; }
            .markdown-viewer { padding: 1.5rem; }
            .toc-sidebar { display: none !important; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="main-layout">
            <!-- Sidebar -->
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <div class="sidebar-title">
                        <span>📝 Markdown Viewer - Multi-File</span>
                    </div>
                    
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="searchInput" placeholder="Search workspace..." />
                    </div>

                    <div class="upload-input-wrapper">
                        <label for="fileInput" class="upload-input-label">
                            <i class="fa-solid fa-plus"></i> Add Files
                        </label>
                        <button class="clear-all-btn" id="clearAllBtn" disabled title="Clear Workspace">Clear All</button>
                    </div>
                    <input type="file" id="fileInput" accept=".md,.markdown,.txt" multiple />
                </div>

                <div class="sidebar-content">
                    <ul class="file-list" id="fileList"></ul>
                    <div class="empty-sidebar" id="emptySidebar">
                        No files imported yet
                    </div>
                </div>
            </div>

            <!-- Content Area -->
            <div class="content-area">
                <div class="top-bar">
                    <div class="top-bar-left">
                        <button class="btn-icon" id="toggleSidebarBtn" title="Toggle Sidebar">
                            <i class="fa-solid fa-bars-staggered"></i>
                        </button>
                        <div class="file-info" id="currentFileName">No file selected</div>
                    </div>
                    <button class="btn-icon" id="printBtn" title="Print / Export PDF" style="display: none;">
                        <i class="fa-solid fa-print"></i>
                    </button>
                </div>

                <div class="viewer-container" id="viewerContainer">
                    <div class="upload-zone" id="uploadZone">
                        <div class="upload-icon">📤</div>
                        <h2>Drop files here or click to browse</h2>
                        <p>Import markdown files to start viewing</p>
                        <label for="uploadZoneInput" class="upload-input-label">Browse Files</label>
                        <input type="file" id="uploadZoneInput" accept=".md,.markdown,.txt" multiple />
                        <p class="upload-hint">Supports .md, .markdown, and .txt files</p>
                    </div>

                    <div class="markdown-viewer" id="markdownViewer"></div>
                </div>
            </div>

            <!-- Right Sidebar for Table of Contents -->
            <aside class="toc-sidebar" id="tocSidebar">
                <div class="toc-title">On this page</div>
                <ul class="toc-list" id="tocList"></ul>
            </aside>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadZoneInput = document.getElementById('uploadZoneInput');
        const uploadZone = document.getElementById('uploadZone');
        const markdownViewer = document.getElementById('markdownViewer');
        const fileList = document.getElementById('fileList');
        const emptySidebar = document.getElementById('emptySidebar');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const currentFileName = document.getElementById('currentFileName');
        const printBtn = document.getElementById('printBtn');
        const viewerContainer = document.getElementById('viewerContainer');
        const searchInput = document.getElementById('searchInput');
        const tocSidebar = document.getElementById('tocSidebar');
        const tocList = document.getElementById('tocList');
        const sidebar = document.getElementById('sidebar');
        const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');

        let files = {};
        let currentFileId = null;
        let fuse = null;

        // Initialize markdown-it
        const md = window.markdownit({
            html: false,
            linkify: true,
            typographer: true,
            highlight: function (str, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try { return hljs.highlight(str, { language: lang }).value; } catch (__) {}
                }
                return hljs.highlightAuto(str).value;
            }
        }).use(window.markdownitFootnote);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
        }

        // Helper: Escape HTML so MathJax receives perfectly un-sanitized symbols
        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        function saveWorkspace() {
            try {
                localStorage.setItem('md_workspace', JSON.stringify(files));
                localStorage.setItem('md_current', currentFileId);
            } catch (e) { console.warn('Storage limit reached.'); }
        }

        function loadWorkspace() {
            const saved = localStorage.getItem('md_workspace');
            const current = localStorage.getItem('md_current');
            if (saved) {
                files = JSON.parse(saved);
                updateUI();
                if (current && files[current]) loadFile(current);
            }
        }

        function initSearch() {
            const data = Object.keys(files).map(id => ({ id, name: files[id].name, content: files[id].content }));
            fuse = new Fuse(data, { keys: ['name', 'content'], threshold: 0.3 });
        }

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value;
            if (!term) { updateUI(); return; }
            if (fuse) renderFileList(fuse.search(term).map(r => r.item.id));
        });

        toggleSidebarBtn.addEventListener('click', () => sidebar.classList.toggle('collapsed'));

        fileInput.addEventListener('change', (e) => { handleFileSelection(e.target.files); e.target.value = ''; });
        uploadZoneInput.addEventListener('change', (e) => { handleFileSelection(e.target.files); e.target.value = ''; });
        
        uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault(); uploadZone.classList.remove('drag-over'); handleFileSelection(e.dataTransfer.files);
        });

        function handleFileSelection(selectedFiles) {
            for (let file of selectedFiles) {
                if (file.type === 'text/plain' || file.name.match(/\.(md|markdown|txt|csv)$/i)) {
                    const reader = new FileReader();
                    const fileId = `file_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;

                    reader.onload = (e) => {
                        files[fileId] = { name: file.name, content: e.target.result, scrollTop: 0 };
                        updateUI(); saveWorkspace();
                        if (!currentFileId) loadFile(fileId);
                    };
                    reader.readAsText(file);
                }
            }
        }

        function updateUI() {
            renderFileList(Object.keys(files));
            initSearch();
        }

        function renderFileList(fileIds) {
            fileList.innerHTML = '';
            
            if (fileIds.length === 0) {
                emptySidebar.style.display = 'block';
                clearAllBtn.disabled = true;
                uploadZone.style.display = 'flex';
                markdownViewer.classList.remove('active');
                tocSidebar.style.display = 'none';
                printBtn.style.display = 'none';
                currentFileName.textContent = 'No file selected';
                currentFileId = null;
                return;
            }

            emptySidebar.style.display = 'none';
            clearAllBtn.disabled = false;
            printBtn.style.display = 'block';

            fileIds.forEach((fileId) => {
                const file = files[fileId];
                if (!file) return;

                const li = document.createElement('li');
                li.className = 'file-item' + (fileId === currentFileId ? ' active' : '');
                li.innerHTML = `
                    <div class="file-item-name"><span class="file-item-icon">📄</span><span>${file.name}</span></div>
                    <button class="file-item-delete" data-id="${fileId}" title="Delete"><i class="fa-solid fa-xmark"></i></button>
                `;

                li.addEventListener('click', (e) => {
                    if (!e.target.closest('.file-item-delete') && fileId !== currentFileId) loadFile(fileId);
                });
                li.querySelector('.file-item-delete').addEventListener('click', (e) => {
                    e.stopPropagation(); deleteFile(fileId);
                });
                fileList.appendChild(li);
            });
        }

        function loadFile(fileId) {
            if (currentFileId && files[currentFileId]) files[currentFileId].scrollTop = viewerContainer.scrollTop;
            currentFileId = fileId;
            currentFileName.textContent = files[fileId].name;
            uploadZone.style.display = 'none';
            updateUI(); saveWorkspace();
            renderMarkdown(files[fileId].content, fileId);
        }

        function deleteFile(fileId) {
            delete files[fileId];
            if (currentFileId === fileId) {
                const remaining = Object.keys(files);
                currentFileId = remaining.length > 0 ? remaining[0] : null;
            }
            updateUI(); saveWorkspace();
            if (currentFileId) loadFile(currentFileId);
            else {
                currentFileName.textContent = 'No file selected';
                markdownViewer.classList.remove('active');
                tocSidebar.style.display = 'none';
                uploadZone.style.display = 'flex';
            }
        }

        clearAllBtn.addEventListener('click', () => {
            if (confirm('Are you sure you want to delete all files from workspace?')) {
                files = {}; currentFileId = null; updateUI(); saveWorkspace();
            }
        });

        printBtn.addEventListener('click', () => window.print());

        // --- Foolproof Core Rendering Engine ---
        async function renderMarkdown(markdown, targetFileId) {
            try {
                let processedText = markdown;

                // 1. Pre-process Mermaid diagrams so markdown-it ignores them entirely
                processedText = processedText.replace(/```mermaid\n([\s\S]*?)\n```/g, '<div class="mermaid">$1</div>');

                // 2. Protect Code Blocks from the Math regex (prevents standard bash variables like $PATH from triggering math logic)
                const codeBlocks = [];
                // Block code
                processedText = processedText.replace(/```[\s\S]*?```/g, match => {
                    codeBlocks.push(match); return `__CODE_BLOCK_${codeBlocks.length - 1}__`;
                });
                // Inline code
                processedText = processedText.replace(/`[^`\n]+`/g, match => {
                    codeBlocks.push(match); return `__CODE_INLINE_${codeBlocks.length - 1}__`;
                });

                // 3. Extract Display Math ($$ ... $$)
                const displayMath = [];
                processedText = processedText.replace(/\$\$(.*?)\$\$/gs, (match) => {
                    displayMath.push(match);
                    return `__DISPLAY_MATH_${displayMath.length - 1}__`;
                });

                // 4. Extract Inline Math ($ ... $) 
                // Uses negative lookaheads/behinds to safely ignore "$5 and $10" while perfectly capturing "$\vec{F}_i$"
                const inlineMath = [];
                processedText = processedText.replace(/\$(?!\s)((?:\\.|[^$\n])+?)(?<!\s)\$/g, (match) => {
                    inlineMath.push(match);
                    return `__INLINE_MATH_${inlineMath.length - 1}__`;
                });

                // 5. Restore Code Blocks so markdown-it can format them properly
                processedText = processedText.replace(/__CODE_BLOCK_(\d+)__/g, (match, i) => codeBlocks[i]);
                processedText = processedText.replace(/__CODE_INLINE_(\d+)__/g, (match, i) => codeBlocks[i]);

                // 6. Parse the Markdown
                const rawHtml = md.render(processedText);
                
                // 7. Sanitize the HTML
                const cleanHtml = DOMPurify.sanitize(rawHtml, {
                    USE_PROFILES: { html: true },
                    ADD_ATTR: ['target', 'rel', 'id', 'class'],
                    ADD_CLASSES: { div: ['mermaid'] }
                });

                // 8. Safely inject the equations back into the DOM where DOMPurify can no longer touch them
                let finalHtml = cleanHtml;
                displayMath.forEach((math, i) => {
                    finalHtml = finalHtml.replace(`__DISPLAY_MATH_${i}__`, `<span class="math-display">${escapeHtml(math)}</span>`);
                });
                inlineMath.forEach((math, i) => {
                    finalHtml = finalHtml.replace(`__INLINE_MATH_${i}__`, `<span class="math-inline">${escapeHtml(math)}</span>`);
                });

                markdownViewer.innerHTML = finalHtml;
                markdownViewer.classList.add('active');

                // Feature integrations
                generateTableOfContents();
                addCopyButtons();
                process3Dmol();
                processCharts();

                // External Links
                markdownViewer.querySelectorAll('a').forEach((link) => {
                    if (link.hostname !== window.location.hostname) {
                        link.setAttribute('target', '_blank');
                        link.setAttribute('rel', 'noopener noreferrer');
                    }
                });

                // Safely trigger MathJax. Includes a retry mechanism in case the user instantly switches files while the MathJax CDN is still downloading.
                function typesetMath() {
                    if (window.MathJax && window.MathJax.typesetPromise) {
                        window.MathJax.typesetPromise([markdownViewer]).catch(err => console.error("MathJax Rendering Error:", err));
                    } else {
                        setTimeout(typesetMath, 50); 
                    }
                }
                typesetMath();

                // Render Mermaid Diagrams
                if (markdownViewer.querySelector('.mermaid')) {
                    mermaid.initialize({ startOnLoad: false, theme: 'default' });
                    await mermaid.run({ nodes: markdownViewer.querySelectorAll('.mermaid') });
                }

                // Restore previous exact scroll position
                if (targetFileId && files[targetFileId] && files[targetFileId].scrollTop !== undefined) {
                    viewerContainer.scrollTop = files[targetFileId].scrollTop;
                } else {
                    viewerContainer.scrollTop = 0;
                }

            } catch (error) {
                markdownViewer.innerHTML = `<div style="color: var(--danger); padding: 2rem;"><h2>Error rendering markdown</h2><p>${error.message}</p></div>`;
                markdownViewer.classList.add('active');
            }
        }

        // Table of Contents
        function generateTableOfContents() {
            tocList.innerHTML = '';
            const headings = markdownViewer.querySelectorAll('h1, h2, h3');
            
            if (headings.length > 0) {
                tocSidebar.style.display = 'flex';
                headings.forEach(heading => {
                    const id = heading.id || heading.innerText.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
                    heading.id = id;
                    
                    const li = document.createElement('li');
                    const link = document.createElement('a');
                    link.href = `#${id}`; link.innerText = heading.innerText;
                    link.className = `toc-link toc-${heading.tagName.toLowerCase()}`;
                    
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        viewerContainer.scrollTo({ top: heading.offsetTop - 80, behavior: 'smooth' });
                    });
                    
                    li.appendChild(link); tocList.appendChild(li);
                });
            } else { tocSidebar.style.display = 'none'; }
        }

        // Copy button script generator
        function addCopyButtons() {
            markdownViewer.querySelectorAll('pre').forEach(pre => {
                if (pre.parentNode.classList.contains('code-wrapper')) return;
                const wrapper = document.createElement('div'); wrapper.className = 'code-wrapper';
                pre.parentNode.insertBefore(wrapper, pre); wrapper.appendChild(pre);

                const btn = document.createElement('button'); btn.className = 'copy-code-btn'; btn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy';
                btn.addEventListener('click', () => {
                    navigator.clipboard.writeText(pre.querySelector('code').innerText);
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied';
                    setTimeout(() => btn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy', 2000);
                });
                wrapper.appendChild(btn);
            });
        }

        function process3Dmol() {
            markdownViewer.querySelectorAll('.language-pdb').forEach((block, idx) => {
                const wrapper = block.closest('.code-wrapper'); if (!wrapper) return;
                const container = document.createElement('div'); container.id = 'viewer3d_' + idx; container.className = 'mol-viewer-container';
                wrapper.replaceWith(container);
                let viewer = $3Dmol.createViewer(container, { backgroundColor: '#f8fafc' });
                viewer.addModel(block.innerText, 'pdb'); viewer.setStyle({}, { cartoon: { color: 'spectrum' }, stick: { radius: 0.1 } });
                viewer.zoomTo(); viewer.render();
            });
        }

        function processCharts() {
            markdownViewer.querySelectorAll('.language-chart').forEach((block) => {
                const wrapper = block.closest('.code-wrapper'); if (!wrapper) return;
                const lines = block.innerText.trim().split('\n'); if (lines.length < 3) return;
                
                const type = lines[0].trim(), labels = lines[1].split(',').slice(1), datasets = [], colors = ['#3b82f6', '#ef4444', '#10b981', '#f59e0b'];
                for (let i = 2; i < lines.length; i++) {
                    const row = lines[i].split(',');
                    datasets.push({ label: row[0], data: row.slice(1).map(Number), borderColor: colors[(i-2) % colors.length], backgroundColor: colors[(i-2) % colors.length] + '33', tension: 0.3 });
                }

                const container = document.createElement('div'); container.className = 'chart-container';
                const canvas = document.createElement('canvas'); container.appendChild(canvas); wrapper.replaceWith(container);
                new Chart(canvas, { type: type, data: { labels: labels, datasets: datasets }, options: { responsive: true, maintainAspectRatio: false } });
            });
        }

        loadWorkspace();
    </script>
</body>
