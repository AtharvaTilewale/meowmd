<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Documentation Server</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    
    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Markdown & Core Rendering Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/13.0.2/markdown-it.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it-footnote/3.0.3/markdown-it-footnote.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.5/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.4.0/dist/mermaid.min.js"></script>
    
    <!-- Math Rendering Dependencies (KaTeX + Texmath) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-texmath/texmath.min.js"></script>
    
    <!-- Advanced Visualization Dependencies -->
    <script src="https://3Dmol.csb.pitt.edu/build/3Dmol-min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Search Dependency -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js/dist/fuse.min.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --bg-app: #f8fafc;
            --bg-panel: #ffffff;
            --bg-hover: #f1f5f9;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --danger-light: #fef2f2;
            
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'Fira Code', monospace;
            --radius: 12px;
            --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 10px 15px -3px rgb(0 0 0 / 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-app);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Layout */
        .sidebar {
            width: 300px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; flex-shrink: 0; z-index: 10;
            transition: transform 0.3s ease;
        }
        .sidebar.collapsed { transform: translateX(-100%); position: absolute; height: 100%; }

        .toc-sidebar {
            width: 250px;
            background-color: var(--bg-panel);
            border-left: 1px solid var(--border-color);
            display: flex; flex-direction: column; flex-shrink: 0;
            padding: 1.5rem;
            overflow-y: auto;
            display: none;
        }

        .main-content {
            flex: 1; display: flex; flex-direction: column; position: relative;
            background-color: var(--bg-app);
        }

        /* Sidebar Elements */
        .sidebar-header { padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; border-bottom: 1px solid var(--border-color); }
        .branding { display: flex; justify-content: space-between; font-weight: 700; font-size: 1.1rem; color: #0f172a; }
        
        .search-box {
            position: relative;
            width: 100%;
        }
        .search-box input {
            width: 100%; padding: 0.6rem 1rem 0.6rem 2.2rem;
            border: 1px solid var(--border-color); border-radius: 8px;
            font-family: var(--font-sans); font-size: 0.9rem;
            outline: none; transition: border-color 0.2s;
        }
        .search-box input:focus { border-color: var(--primary); }
        .search-box i { position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.9rem;}

        .action-buttons { display: flex; gap: 0.5rem; }
        .btn {
            flex: 1; padding: 0.6rem; border: none; border-radius: 6px;
            font-family: var(--font-sans); font-weight: 500; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            font-size: 0.85rem; box-shadow: var(--shadow-sm);
        }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-outline { background-color: white; border: 1px solid var(--border-color); color: var(--text-main); }
        .btn-outline:hover { background-color: var(--bg-hover); }
        .btn-danger { background: none; color: var(--danger); box-shadow: none; flex: 0 0 auto; padding: 0.6rem; }
        
        .file-list { flex: 1; overflow-y: auto; padding: 1rem; list-style: none; }
        .file-item {
            padding: 0.75rem 1rem; margin-bottom: 0.5rem; border-radius: 8px;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
        }
        .file-item:hover { background-color: var(--bg-hover); }
        .file-item.active { background-color: var(--primary-light); color: var(--primary-hover); font-weight: 600; }
        .file-name { display: flex; gap: 0.5rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.9rem; }
        
        .delete-file { background: none; border: none; color: var(--text-muted); cursor: pointer; opacity: 0; }
        .file-item:hover .delete-file { opacity: 1; }
        .delete-file:hover { color: var(--danger); }

        /* Top Bar */
        .top-bar {
            height: 60px; background-color: var(--bg-panel); border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between; padding: 0 2rem; z-index: 5;
        }
        .btn-icon { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; padding: 0.5rem; border-radius: 6px; }
        .btn-icon:hover { background-color: var(--bg-hover); color: var(--primary); }

        /* Viewer Area */
        .viewer-container { flex: 1; overflow-y: auto; padding: 2rem; scroll-behavior: auto; }
        
        .upload-zone {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100%; max-width: 500px; padding: 4rem 3rem;
            border: 2px dashed #cbd5e1; border-radius: 16px; text-align: center;
            background-color: var(--bg-panel); cursor: pointer;
        }
        
        /* Markdown Body */
        .markdown-body {
            max-width: 850px; margin: 0 auto; padding: 3rem 4rem;
            background-color: var(--bg-panel); box-shadow: var(--shadow-md); border-radius: 16px;
            font-size: 1.05rem; line-height: 1.8; display: none;
        }
        .markdown-body.active { display: block; }
        
        /* Typography Elements */
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { color: #0f172a; font-weight: 600; margin-top: 2rem; margin-bottom: 1rem; }
        .markdown-body h1 { font-size: 2.2rem; border-bottom: 2px solid var(--border-color); padding-bottom: 0.5rem; }
        .markdown-body h2 { font-size: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }
        
        /* Code Blocks & Copy Button */
        .code-wrapper { position: relative; margin: 1.5rem 0; }
        .copy-code-btn {
            position: absolute; top: 0.5rem; right: 0.5rem; background: var(--bg-panel);
            border: 1px solid var(--border-color); border-radius: 6px; padding: 0.4rem;
            color: var(--text-muted); cursor: pointer; opacity: 0; transition: opacity 0.2s;
            font-size: 0.8rem; z-index: 2;
        }
        .code-wrapper:hover .copy-code-btn { opacity: 1; }
        .copy-code-btn:hover { color: var(--primary); border-color: var(--primary); }
        
        .markdown-body pre {
            background-color: var(--bg-app); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 1.5rem; overflow-x: auto; font-size: 0.9em; margin: 0;
        }
        .markdown-body code { font-family: var(--font-mono); font-size: 0.85em; }
        .markdown-body p code { background-color: var(--bg-hover); padding: 0.2em 0.4em; border-radius: 4px; color: #db2777; border: 1px solid var(--border-color); }
        
        /* Math Equation Scrolling */
        .markdown-body .katex-display {
            overflow-x: auto;
            overflow-y: hidden;
            padding-bottom: 0.5rem;
        }

        /* Tables */
        .markdown-body table {
            display: block; width: 100%; max-width: 100%; overflow-x: auto; white-space: nowrap;
            border-collapse: collapse; margin: 2rem 0; font-size: 0.95em;
        }
        .markdown-body th, .markdown-body td { border: 1px solid var(--border-color); padding: 0.75rem 1rem; }
        .markdown-body th { background-color: var(--bg-hover); }

        /* Custom Viz Containers */
        .mol-viewer-container { height: 450px; border-radius: 12px; border: 1px solid var(--border-color); margin: 2rem 0; overflow: hidden; position: relative; }
        .chart-container { margin: 2rem 0; padding: 1rem; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 12px; }

        /* Table of Contents */
        .toc-title { font-weight: 600; font-size: 0.9rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 1rem; letter-spacing: 0.5px; }
        .toc-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
        .toc-link { text-decoration: none; color: var(--text-main); font-size: 0.9rem; transition: color 0.2s; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .toc-link:hover { color: var(--primary); }
        .toc-h2 { padding-left: 1rem; font-size: 0.85rem; color: var(--text-muted); }
        .toc-h3 { padding-left: 2rem; font-size: 0.8rem; color: var(--text-muted); }
        
        /* Footnotes */
        .footnotes { border-top: 1px solid var(--border-color); margin-top: 3rem; padding-top: 1rem; font-size: 0.9rem; color: var(--text-muted); }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <!-- Main Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="branding">
                <span><i class="fa-solid fa-microscope text-primary"></i> Workspace</span>
                <button class="btn-icon" id="syncBtn" title="Sync Status"><i class="fa-solid fa-cloud-check" style="color: var(--primary);"></i></button>
            </div>
            
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search documents..." />
            </div>
            
            <div class="action-buttons">
                <label for="fileInput" class="btn btn-primary" title="Import Files">
                    <i class="fa-solid fa-file-import"></i> Files
                </label>
                <label for="folderInput" class="btn btn-outline" title="Import Folder">
                    <i class="fa-solid fa-folder-tree"></i> Folder
                </label>
                <button class="btn btn-danger" id="clearAllBtn" title="Clear Workspace">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
                <input type="file" id="fileInput" accept=".md,.markdown,.txt" multiple />
                <input type="file" id="folderInput" webkitdirectory directory multiple /> 
            </div>
        </div>

        <ul class="file-list" id="fileList"></ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <div class="top-bar">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <button class="btn-icon" id="toggleSidebarBtn"><i class="fa-solid fa-bars-staggered"></i></button>
                <div style="font-weight: 500; color: var(--text-muted);" id="currentFileName">Welcome</div>
            </div>
            <button class="btn-icon" id="printBtn" style="display: none;"><i class="fa-solid fa-print"></i></button>
        </div>

        <div class="viewer-container" id="viewerContainer">
            <div class="upload-zone" id="uploadZone">
                <i class="fa-solid fa-database" style="font-size: 3rem; color: var(--primary); margin-bottom: 1rem;"></i>
                <h3>Drop files or folders here</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Workspace automatically saves locally</p>
                <input type="file" id="uploadZoneInput" accept=".md,.markdown,.txt" multiple />
            </div>

            <div class="markdown-body" id="markdownViewer"></div>
        </div>
    </main>

    <!-- Right Sidebar for ToC -->
    <aside class="toc-sidebar" id="tocSidebar">
        <div class="toc-title">On this page</div>
        <ul class="toc-list" id="tocList"></ul>
    </aside>

    <script>
        // DOM Elements
        const fileInput = document.getElementById('fileInput');
        const folderInput = document.getElementById('folderInput');
        const uploadZoneInput = document.getElementById('uploadZoneInput');
        const uploadZone = document.getElementById('uploadZone');
        const markdownViewer = document.getElementById('markdownViewer');
        const fileList = document.getElementById('fileList');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const currentFileName = document.getElementById('currentFileName');
        const viewerContainer = document.getElementById('viewerContainer');
        const searchInput = document.getElementById('searchInput');
        const tocSidebar = document.getElementById('tocSidebar');
        const tocList = document.getElementById('tocList');
        
        let files = {};
        let currentFileId = null;
        let fuse; // Search engine

        // Initialize Markdown-it with Footnotes and Texmath plugins
        const md = window.markdownit({
            html: false, 
            linkify: true,
            typographer: true,
            highlight: function (str, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try { return hljs.highlight(str, { language: lang }).value; } catch (__) {}
                }
                return hljs.highlightAuto(str).value;
            }
        })
        .use(window.markdownitFootnote)
        .use(window.texmath, { engine: window.katex, delimiters: 'dollars' }); // Added Texmath initialization

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.error('SW Failed:', err));
            });
        }

        // --- Workspace Persistence (LocalStorage) ---
        function saveWorkspace() {
            try {
                localStorage.setItem('md_workspace', JSON.stringify(files));
                localStorage.setItem('md_current', currentFileId);
            } catch (e) {
                console.warn('Storage quota exceeded, unable to save workspace.');
            }
        }

        function loadWorkspace() {
            const saved = localStorage.getItem('md_workspace');
            const current = localStorage.getItem('md_current');
            if (saved) {
                files = JSON.parse(saved);
                updateUI();
                if (current && files[current]) {
                    loadFile(current);
                }
            }
        }

        // --- Search Initialization ---
        function initSearch() {
            const data = Object.keys(files).map(id => ({ id, name: files[id].name, content: files[id].content }));
            fuse = new Fuse(data, { keys: ['name', 'content'], threshold: 0.3 });
        }

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value;
            if (!term) { updateUI(); return; }
            const results = fuse.search(term);
            renderFileList(results.map(r => r.item.id));
        });

        // --- File Handling ---
        [fileInput, folderInput, uploadZoneInput].forEach(input => {
            input.addEventListener('change', (e) => processFiles(e.target.files));
        });
        
        uploadZone.addEventListener('click', () => fileInput.click());
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
            uploadZone.addEventListener(evt, (e) => { e.preventDefault(); e.stopPropagation(); });
        });
        uploadZone.addEventListener('dragover', () => uploadZone.style.borderColor = 'var(--primary)');
        uploadZone.addEventListener('dragleave', () => uploadZone.style.borderColor = '#cbd5e1');
        uploadZone.addEventListener('drop', (e) => {
            uploadZone.style.borderColor = '#cbd5e1';
            processFiles(e.dataTransfer.files);
        });

        function processFiles(selectedFiles) {
            Array.from(selectedFiles).forEach(file => {
                if (file.name.match(/\.(md|markdown|txt|csv)$/i)) {
                    const reader = new FileReader();
                    const fileId = `file_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
                    reader.onload = (e) => {
                        files[fileId] = { name: file.name, content: e.target.result, scrollTop: 0 };
                        updateUI();
                        saveWorkspace();
                        if (!currentFileId) loadFile(fileId);
                    };
                    reader.readAsText(file);
                }
            });
        }

        function updateUI() {
            renderFileList(Object.keys(files));
            initSearch();
        }

        function renderFileList(fileIds) {
            fileList.innerHTML = '';
            if (Object.keys(files).length === 0) {
                uploadZone.style.display = 'block';
                markdownViewer.classList.remove('active');
                tocSidebar.style.display = 'none';
                return;
            }

            fileIds.forEach(id => {
                const li = document.createElement('li');
                li.className = `file-item ${id === currentFileId ? 'active' : ''}`;
                li.innerHTML = `
                    <div class="file-name" title="${files[id].name}">
                        <i class="fa-regular fa-file-lines"></i>
                        <span>${files[id].name}</span>
                    </div>
                    <button class="delete-file" data-id="${id}"><i class="fa-solid fa-xmark"></i></button>
                `;
                li.addEventListener('click', (e) => {
                    if (!e.target.closest('.delete-file') && id !== currentFileId) loadFile(id);
                });
                li.querySelector('.delete-file').addEventListener('click', (e) => {
                    e.stopPropagation(); deleteFile(id);
                });
                fileList.appendChild(li);
            });
        }

        function loadFile(id) {
            if (currentFileId && files[currentFileId]) {
                files[currentFileId].scrollTop = viewerContainer.scrollTop;
            }
            currentFileId = id;
            currentFileName.textContent = files[id].name;
            uploadZone.style.display = 'none';
            updateUI();
            saveWorkspace();
            renderMarkdown(files[id].content, id);
        }

        function deleteFile(id) {
            delete files[id];
            if (currentFileId === id) {
                const remaining = Object.keys(files);
                currentFileId = remaining.length > 0 ? remaining[0] : null;
            }
            updateUI();
            saveWorkspace();
            if (currentFileId) { loadFile(currentFileId); }
            else { 
                currentFileName.textContent = 'Workspace';
                markdownViewer.classList.remove('active');
                tocSidebar.style.display = 'none';
                uploadZone.style.display = 'block';
            }
        }

        clearAllBtn.addEventListener('click', () => {
            if (confirm('Clear entire workspace?')) {
                files = {}; currentFileId = null;
                updateUI(); saveWorkspace();
                currentFileName.textContent = 'Workspace';
            }
        });

        // --- Core Rendering Engine ---
        async function renderMarkdown(markdownText, targetFileId) {
            try {
                // Pre-process Mermaid
                markdownText = markdownText.replace(/```mermaid\n([\s\S]*?)\n```/g, '<div class="mermaid">$1</div>');
                
                let rawHtml = md.render(markdownText);
                
                // Configured DOMPurify to allow MathML structures and required inline styles
                const cleanHtml = DOMPurify.sanitize(rawHtml, {
                    USE_PROFILES: { html: true, mathMl: true },
                    ADD_ATTR: ['target', 'rel', 'id', 'class', 'style', 'aria-hidden'],
                    ADD_TAGS: ['div', 'span', 'eq', 'eqn'], // Allow tags output by Texmath
                    ADD_CLASSES: { div: ['mermaid'] }
                });

                markdownViewer.innerHTML = cleanHtml;
                markdownViewer.classList.add('active');

                // 1. Generate ToC & Assign IDs
                generateTableOfContents();

                // 2. Add Copy Buttons to Code Blocks
                addCopyButtons();

                // 3. Process 3D Molecular Views (Structural Bioinformatics)
                process3Dmol();

                // 4. Process Data Charts (Simulation Metrics)
                processCharts();

                // Render Mermaid Diagrams dynamically
                if (markdownViewer.querySelector('.mermaid')) {
                    mermaid.initialize({ startOnLoad: false, theme: 'default' });
                    await mermaid.run({ nodes: markdownViewer.querySelectorAll('.mermaid') });
                }

                // Restore Scroll State
                viewerContainer.scrollTop = (targetFileId && files[targetFileId] && files[targetFileId].scrollTop) ? files[targetFileId].scrollTop : 0;

            } catch (err) {
                console.error("Rendering error:", err);
            }
        }

        // --- Feature Integrations ---

        function generateTableOfContents() {
            tocList.innerHTML = '';
            const headings = markdownViewer.querySelectorAll('h1, h2, h3');
            
            if (headings.length > 0) {
                tocSidebar.style.display = 'flex';
                headings.forEach(heading => {
                    const id = heading.id || heading.innerText.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
                    heading.id = id;
                    
                    const li = document.createElement('li');
                    const link = document.createElement('a');
                    link.href = `#${id}`;
                    link.innerText = heading.innerText;
                    link.className = `toc-link toc-${heading.tagName.toLowerCase()}`;
                    
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        viewerContainer.scrollTo({
                            top: heading.offsetTop - 80,
                            behavior: 'smooth'
                        });
                    });
                    
                    li.appendChild(link);
                    tocList.appendChild(li);
                });
            } else {
                tocSidebar.style.display = 'none';
            }
        }

        function addCopyButtons() {
            markdownViewer.querySelectorAll('pre').forEach(pre => {
                const wrapper = document.createElement('div');
                wrapper.className = 'code-wrapper';
                pre.parentNode.insertBefore(wrapper, pre);
                wrapper.appendChild(pre);

                const btn = document.createElement('button');
                btn.className = 'copy-code-btn';
                btn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy';
                btn.addEventListener('click', () => {
                    const code = pre.querySelector('code').innerText;
                    navigator.clipboard.writeText(code);
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied';
                    setTimeout(() => btn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy', 2000);
                });
                wrapper.appendChild(btn);
            });
        }

        function process3Dmol() {
            markdownViewer.querySelectorAll('.language-pdb').forEach((block, idx) => {
                const wrapper = block.closest('.code-wrapper');
                if(!wrapper) return;
                
                const pdbData = block.innerText;
                const container = document.createElement('div');
                container.id = 'viewer3d_' + idx;
                container.className = 'mol-viewer-container';
                
                wrapper.replaceWith(container);

                let viewer = $3Dmol.createViewer(container, { backgroundColor: '#f8fafc' });
                viewer.addModel(pdbData, 'pdb');
                viewer.setStyle({}, { cartoon: { color: 'spectrum' }, stick: { radius: 0.1 } });
                viewer.zoomTo();
                viewer.render();
            });
        }

        function processCharts() {
            markdownViewer.querySelectorAll('.language-chart').forEach((block, idx) => {
                const wrapper = block.closest('.code-wrapper');
                if(!wrapper) return;

                const lines = block.innerText.trim().split('\n');
                if(lines.length < 3) return;

                const type = lines[0].trim();
                const labels = lines[1].split(',').slice(1);
                
                const datasets = [];
                const colors = ['#2563eb', '#ef4444', '#10b981', '#f59e0b'];

                for(let i = 2; i < lines.length; i++) {
                    const row = lines[i].split(',');
                    datasets.push({
                        label: row[0],
                        data: row.slice(1).map(Number),
                        borderColor: colors[(i-2) % colors.length],
                        backgroundColor: colors[(i-2) % colors.length] + '33',
                        tension: 0.3
                    });
                }

                const container = document.createElement('div');
                container.className = 'chart-container';
                const canvas = document.createElement('canvas');
                container.appendChild(canvas);
                
                wrapper.replaceWith(container);

                new Chart(canvas, {
                    type: type,
                    data: { labels: labels, datasets: datasets },
                    options: { responsive: true, maintainAspectRatio: false }
                });
            });
        }

        document.getElementById('toggleSidebarBtn').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('collapsed');
        });

        // Init
        loadWorkspace();

    </script>
</body>
</html>
