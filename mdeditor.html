<body>

  <!-- Navigation Bar -->
  <header>
    <nav class="navbar" aria-label="Main Navigation">
      <a href="https://atharvatilewale.github.io/meowmd/" class="logo" aria-label="MeowMD Home">
        <span class="logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M12 5c.67 0 1.35.09 2 .26 1.78-2 5.03-2.84 6.42-2.26 1.4.58-.42 7-.42 7 .57 1.07.97 2.3.97 3.65 0 5.64-4.04 10.35-9 10.35S3 19.29 3 13.65c0-1.35.4-2.58.97-3.65 0 0-1.82-6.42-.42-7 1.39-.58 4.64.26 6.42 2.26.65-.17 1.33-.26 2-.26z">

        </span>
        MeowMD
      </a>

      <div class="nav-links">
        <a href="https://atharvatilewale.github.io/meowmd/" class="nav-link">Home</a>
        <a href="mdviewer.html" class="nav-link">MD Viewer</a>
        <a href="mdeditor.html" class="nav-link active">MD Generator</a>
        <button class="btn-icon theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Theme">
          <i class="fa-solid fa-moon"></i>
        </button>
      </div>
    </nav>
  </header>

  <!-- Main Editor Application -->
  <main class="editor-app">

    <!-- Action Toolbar Header -->
    <div class="editor-header">
      <div class="editor-title">
        <i class="fa-solid fa-pen-nib" style="color: var(--primary); font-size: 1.25rem;"></i>
        <h2>Markdown Generator</h2>
      </div>

      <div class="editor-actions">
        <label for="editorFileInput" class="btn btn-outline" title="Import File">
          <i class="fa-solid fa-file-import"></i> Import .md
        </label>
        <input type="file" id="editorFileInput" accept=".md,.markdown,.txt" />

        <button class="btn btn-outline" id="clearEditorBtn" title="Clear Content">
          <i class="fa-solid fa-trash-can"></i> Clear
        </button>
        <button class="btn btn-outline" id="copyMdBtn" title="Copy Markdown to Clipboard">
          <i class="fa-regular fa-copy"></i> Copy Markdown
        </button>
        <button class="btn btn-primary" id="downloadMdBtn" title="Download .md File">
          <i class="fa-solid fa-download"></i> Download .md
        </button>
      </div>
    </div>

    <!-- Dual Pane Split Workspace -->
    <div class="editor-workspace">
      <!-- Visual Editor Pane -->
      <section class="pane" aria-label="Visual Rich Text Editor">
        <div class="pane-header">
          <span><i class="fa-solid fa-pen-to-square"></i> Visual Editor</span>
        </div>
        <div class="pane-body">
          <div id="quillEditor"></div>
        </div>
      </section>

      <!-- Markdown Code Output Pane -->
      <section class="pane" aria-label="Generated Markdown Output">
        <div class="pane-header">
          <span><i class="fa-brands fa-markdown"></i> Markdown Output</span>
        </div>
        <div class="pane-body">
          <textarea id="markdownOutput" class="markdown-output-area" spellcheck="false" aria-label="Generated Markdown"></textarea>
        </div>
      </section>
    </div>

    <!-- Status Bar -->
    <div class="editor-status-bar">
      <div class="status-stats">
        <span id="statWords">0 Words</span>
        <span id="statChars">0 Characters</span>
        <span id="statLines">0 Lines</span>
      </div>
      <div>
        <span><i class="fa-solid fa-bolt" style="color: var(--success);"></i> Live Syncing</span>
      </div>
    </div>
  </main>

  <!-- Performance Optimized Scripts -->
  <script src="https://cdn.quilljs.com/1.3.6/quill.js" defer></script>
  <script src="https://unpkg.com/turndown/dist/turndown.js" defer></script>
  <script src="assets/js/common.js" defer></script>
  <script src="assets/js/editor.js" defer></script>
  <script src="assets/js/sw-register.js" defer></script>
</body>

</html>
