  <!-- Main Editor Application -->
  <main class="editor-app">

    <!-- Action Toolbar Header -->
    <div class="editor-header">
      <div class="editor-title">
        <i class="fa-solid fa-pen-nib" style="color: var(--primary); font-size: 1.25rem;"></i>
        <h2>Markdown Editor</h2>
      </div>

      <!-- View Switcher Controls -->
      <div class="view-switchers" aria-label="Layout View Modes">
        <button class="view-btn active" id="viewSplitBtn" title="Split Dual Pane View">
          <i class="fa-solid fa-table-columns"></i> Split
        </button>
        <button class="view-btn" id="viewVisualBtn" title="Visual Editor Only">
          <i class="fa-solid fa-pen-to-square"></i> Visual
        </button>
        <button class="view-btn" id="viewMdBtn" title="Markdown Output Only">
          <i class="fa-brands fa-markdown"></i> Markdown
        </button>
      </div>

      <div class="editor-actions">
        <label for="editorFileInput" class="btn btn-outline" title="Import Markdown or Text File">
          <i class="fa-solid fa-arrow-up"></i> <span>Import</span>
        </label>
        <input type="file" id="editorFileInput" accept=".md,.markdown,.txt" />

        <button class="btn btn-outline" id="clearEditorBtn" title="Clear Content">
          <i class="fa-regular fa-trash-can"></i> <span>Clear</span>
        </button>
        <button class="btn btn-outline" id="copyMdBtn" title="Copy Markdown to Clipboard">
          <i class="fa-regular fa-copy"></i> <span>Copy</span>
        </button>
        <button class="btn btn-primary" id="downloadMdBtn" title="Download .md File">
          <i class="fa-solid fa-arrow-down"></i> <span>Download .md</span>
        </button>
      </div>
    </div>

    <!-- Dual Pane Split Workspace -->
    <div class="editor-workspace view-split">
      
      <!-- Visual Editor Pane -->
      <section class="pane" id="visualPane" aria-label="Visual Rich Text Editor">
        
        <!-- WYSIWYG Action Toolbar -->
        <div class="visual-toolbar" id="visualToolbar" role="toolbar" aria-label="Visual Formatting Tools">
          
          <!-- History -->
          <div class="toolbar-group">
            <button class="tool-btn" id="btnUndo" title="Undo (Ctrl+Z)" aria-label="Undo"><i class="fa-solid fa-rotate-left"></i></button>
            <button class="tool-btn" id="btnRedo" title="Redo (Ctrl+Y)" aria-label="Redo"><i class="fa-solid fa-rotate-right"></i></button>
          </div>

          <!-- Paragraph & Headings -->
          <div class="toolbar-group">
            <select class="tool-select" id="headingSelect" title="Select Heading Level" aria-label="Heading Level">
              <option value="p">Normal text</option>
              <option value="h1">Heading 1 (#)</option>
              <option value="h2">Heading 2 (##)</option>
              <option value="h3">Heading 3 (###)</option>
              <option value="h4">Heading 4 (####)</option>
            </select>
          </div>

          <!-- Text Formatting -->
          <div class="toolbar-group">
            <button class="tool-btn" id="btnBold" title="Bold (**text** - Ctrl+B)" aria-label="Bold"><i class="fa-solid fa-bold"></i></button>
            <button class="tool-btn" id="btnItalic" title="Italic (*text* - Ctrl+I)" aria-label="Italic"><i class="fa-solid fa-italic"></i></button>
            <button class="tool-btn" id="btnUnderline" title="Underline (&lt;u&gt;text&lt;/u&gt; - Ctrl+U)" aria-label="Underline"><i class="fa-solid fa-underline"></i></button>
            <button class="tool-btn" id="btnStrike" title="Strikethrough (~~text~~)" aria-label="Strikethrough"><i class="fa-solid fa-strikethrough"></i></button>
          </div>

          <!-- Sub / Super / Highlight / Kbd -->
          <div class="toolbar-group">
            <button class="tool-btn" id="btnSubscript" title="Subscript (&lt;sub&gt;text&lt;/sub&gt;)" aria-label="Subscript"><i class="fa-solid fa-subscript"></i></button>
            <button class="tool-btn" id="btnSuperscript" title="Superscript (&lt;sup&gt;text&lt;/sup&gt;)" aria-label="Superscript"><i class="fa-solid fa-superscript"></i></button>
            <button class="tool-btn" id="btnMark" title="Highlight Text (&lt;mark&gt;)" aria-label="Highlight"><i class="fa-solid fa-highlighter"></i></button>
            <button class="tool-btn" id="btnKbd" title="Keyboard Tag (&lt;kbd&gt;)" aria-label="Keyboard Tag"><i class="fa-solid fa-keyboard"></i></button>
          </div>

          <!-- Code & Quotes -->
          <div class="toolbar-group">
            <button class="tool-btn" id="btnInlineCode" title="Inline Code (`code`)" aria-label="Inline Code"><i class="fa-solid fa-code"></i></button>
            <button class="tool-btn" id="btnCodeBlock" title="Code Block (```language)" aria-label="Code Block"><i class="fa-solid fa-file-code"></i></button>
            <button class="tool-btn" id="btnQuote" title="Blockquote (&gt; text)" aria-label="Blockquote"><i class="fa-solid fa-quote-left"></i></button>
          </div>

          <!-- Lists & Tasks -->
          <div class="toolbar-group">
            <button class="tool-btn" id="btnUl" title="Bulleted List (- item)" aria-label="Bulleted List"><i class="fa-solid fa-list-ul"></i></button>
            <button class="tool-btn" id="btnOl" title="Numbered List (1. item)" aria-label="Numbered List"><i class="fa-solid fa-list-ol"></i></button>
            <button class="tool-btn" id="btnChecklist" title="Task / Checkbox List (- [ ] item)" aria-label="Task List"><i class="fa-solid fa-list-check"></i></button>
          </div>

          <!-- Alignment -->
          <div class="toolbar-group">
            <button class="tool-btn" id="btnAlignLeft" title="Align Left" aria-label="Align Left"><i class="fa-solid fa-align-left"></i></button>
            <button class="tool-btn" id="btnAlignCenter" title="Align Center" aria-label="Align Center"><i class="fa-solid fa-align-center"></i></button>
            <button class="tool-btn" id="btnAlignRight" title="Align Right" aria-label="Align Right"><i class="fa-solid fa-align-right"></i></button>
          </div>

          <!-- GFM Elements -->
          <div class="toolbar-group">
            <button class="tool-btn" id="btnTable" title="Insert GFM Table (| col | col |)" aria-label="Insert Table"><i class="fa-solid fa-table-cells"></i></button>
            <button class="tool-btn" id="btnAlert" title="Insert GitHub Callout Alert (&gt; [!NOTE])" aria-label="Insert Alert"><i class="fa-solid fa-bell"></i></button>
            <button class="tool-btn" id="btnDetails" title="Collapsible Details (&lt;details&gt;)" aria-label="Collapsible Details"><i class="fa-solid fa-square-caret-down"></i></button>
            <button class="tool-btn" id="btnLink" title="Insert Link ([text](url))" aria-label="Insert Link"><i class="fa-solid fa-link"></i></button>
            <button class="tool-btn" id="btnImage" title="Insert Image (![alt](url))" aria-label="Insert Image"><i class="fa-solid fa-image"></i></button>
            <button class="tool-btn" id="btnHr" title="Horizontal Divider (---)" aria-label="Horizontal Divider"><i class="fa-solid fa-minus"></i></button>
            <button class="tool-btn" id="btnFootnote" title="Footnote ([^1])" aria-label="Footnote"><i class="fa-solid fa-asterisk"></i></button>
          </div>

          <!-- Reset -->
          <div class="toolbar-group">
            <button class="tool-btn" id="btnClearFormat" title="Clear Formatting" aria-label="Clear Formatting"><i class="fa-solid fa-text-slash"></i></button>
          </div>

        </div>

        <div class="pane-body">
          <div id="visualEditor" class="visual-editor" contenteditable="true" spellcheck="true" aria-label="Visual WYSIWYG Editor"></div>
        </div>
      </section>

      <!-- Markdown Code Output Pane -->
      <section class="pane" id="mdPane" aria-label="Generated Markdown Output">
        <div class="pane-header">
          <span>Markdown output</span>
          <div class="pane-header-actions">
            <button class="btn-subtle" id="syncToVisualBtn" title="Parse Markdown back into the visual editor">
              <i class="fa-solid fa-rotate"></i> Sync to visual
            </button>
          </div>
        </div>
        <div class="pane-body">
          <textarea id="markdownOutput" class="markdown-output-area" spellcheck="false" aria-label="Generated Markdown" placeholder="Markdown appears here as you write"></textarea>
        </div>
      </section>

    </div>

    <!-- Status Bar -->
    <div class="editor-status-bar">
      <div class="status-stats">
        <span id="statWords"><i class="fa-regular fa-file-lines"></i> 0 Words</span>
        <span id="statChars">0 Characters</span>
        <span id="statLines">0 Lines</span>
      </div>
      <div class="status-indicator">
        <span>Syncing</span>
      </div>
    </div>
  </main>

  <!-- Modal: Insert Table -->
  <div class="modal-overlay" id="tableModal" role="dialog" aria-modal="true" aria-labelledby="tableModalTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="tableModalTitle">Insert table</h3>
        <button class="modal-close-btn" aria-label="Close Table Modal"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="tableModalForm">
        <div class="modal-body">
          <div class="form-row">
            <div class="form-group">
              <label for="tableRowsInput">Rows</label>
              <input type="number" id="tableRowsInput" min="1" max="50" value="3" required />
            </div>
            <div class="form-group">
              <label for="tableColsInput">Columns</label>
              <input type="number" id="tableColsInput" min="1" max="20" value="3" required />
            </div>
          </div>
          <p class="form-hint">Inserts a GitHub Flavored Markdown table.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline modal-close-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Insert table</button>
        </div>
      </form>
    </div>
  </div>

            </div>
          </button>

      </div>
