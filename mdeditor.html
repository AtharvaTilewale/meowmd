    <style>
        :root {
            /* MeowMD Theme Variables */
            --primary-color: #fe6b5e; 
            --primary-hover: #ff7163;
            --border-color: #fad1cd;
            --bg-color: #fff9f5;
            --card-bg: #ffffff;
            --text-main: #4a403a;
            --text-muted: #8c7e77;
            --font-main: 'Nunito', sans-serif;
            --border-radius: 24px;
        }

        ::selection {
            background-color: var(--primary-color);
            color: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
            -webkit-font-smoothing: antialiased;
        }

        /* Top Navigation Bar */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            color: var(--text-main);
        }

        /* Unified MeowMD Navbar */
.navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    height: 70px;
    background-color: var(--bg-color, var(--bg-panel));
    border-bottom: 1px solid var(--border-color, transparent);
    flex-shrink: 0;
    z-index: 100;
}

.navbar .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 22px;
    font-weight: 800;
    color: var(--text-main);
    text-decoration: none;
}

.logo svg {
    /* Automatically falls back to whichever variable the page uses */
    color: var(--accent-color, var(--primary-color, var(--primary)));
}

.nav-links {
    display: flex;
    gap: 32px;
    font-size: 16px;
    font-weight: 800;
}

.nav-links a {
    color: var(--text-muted);
    text-decoration: none;
    transition: color 0.3s ease;
    position: relative;
}

.nav-links a:hover, 
.nav-links a.active {
    color: var(--accent-color, var(--primary-color, var(--primary)));
}

/* Active State Underline */
.nav-links a.active::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 100%;
    height: 2px;
    background-color: var(--accent-color, var(--primary-color, var(--primary)));
    border-radius: 2px;
}

/* Mobile Responsiveness */
@media (max-width: 600px) {
    .navbar {
        padding: 15px 20px;
        flex-direction: column;
        gap: 16px;
        height: auto;
    }
}

        .export-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-family: var(--font-main);
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .export-btn:hover {
            background-color: var(--primary-hover);
        }

        /* Split Screen Container */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 1rem;
            gap: 1rem;
        }

        /* Left Side: Rich Text Editor */
        .editor-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(74, 64, 58, 0.05);
            border: 2px solid transparent;
            overflow: hidden;
        }

        #quill-editor {
            flex: 1;
            font-size: 1rem;
            font-family: var(--font-main);
        }

        .ql-toolbar {
            background: var(--bg-color);
            border-color: var(--border-color) !important;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }
        
        .ql-container {
            border-color: var(--border-color) !important;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }

        /* Right Side: Markdown Output */
        .markdown-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--card-bg); 
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(74, 64, 58, 0.05);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

       .md-header {
    background: var(--bg-color);
    color: var(--text-main);
    padding: 0.75rem 1rem;
    font-size: 0.875rem;
    font-weight: 800;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

        #md-output {
            flex: 1;
            background: transparent;
            color: var(--text-main);
            padding: 1rem;
            border: none;
            resize: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            outline: none;
        }
        /* Window Resizer Handle */
/* Window Resizer Handle Container */
.resizer {
    width: 16px;
    cursor: col-resize;
    margin: 0 -0.5rem; /* Absorbs the 1rem gap from workspace */
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Permanent subtle visual indicator (a small pill) */
.resizer::after {
    content: '';
    width: 4px;
    height: 50px;
    background-color: var(--border-color, #fad1cd);
    border-radius: 4px;
    transition: all 0.2s ease;
}

/* Expands and lights up when hovered or actively dragging */
.resizer:hover::after, 
.resizer.resizing::after {
    background-color: var(--accent-color, #fe6b5e);
    height: 100%;
    width: 8px;
}

<div class="workspace">

    <!-- DRAG HANDLE -->
    <div class="resizer" id="dragMe"></div>

    <!-- Right: Markdown Preview -->
    <div class="markdown-container">
        <div class="md-header">
            <span>Real-Time MD Preview</span>
            <!-- Failsafe Button Styles to ensure visibility -->
            <button onclick="exportMarkdown()" style="background-color: var(--accent-color, #fe6b5e); color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; font-weight: 800; font-size: 0.8rem; cursor: pointer; z-index: 50;">
                Export .MD
            </button>

        <textarea id="md-output" readonly placeholder="Your generated markdown will appear here..."></textarea>

</div>

    <!-- Load Libraries -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="https://unpkg.com/turndown/dist/turndown.js"></script>
    <script>
    // --- Window Resize Logic ---
    const resizer = document.getElementById('dragMe');
    const leftPane = document.getElementById('left-pane');
    let startX = 0;
    let startWidth = 0;

    const mouseDownHandler = function(e) {
        startX = e.clientX;
        startWidth = leftPane.getBoundingClientRect().width;
        
        resizer.classList.add('resizing');
        document.addEventListener('mousemove', mouseMoveHandler);
        document.addEventListener('mouseup', mouseUpHandler);
        
        // Prevent accidental text highlighting while dragging
        document.body.style.userSelect = 'none';
        document.body.style.cursor = 'col-resize';
    };

    const mouseMoveHandler = function(e) {
        const dx = e.clientX - startX;
        // Calculate new width as a percentage of the workspace
        const newLeftWidth = ((startWidth + dx) * 100) / resizer.parentNode.getBoundingClientRect().width;
        // Apply the new width via flex-basis
        leftPane.style.flex = `0 0 ${newLeftWidth}%`;
    };

    const mouseUpHandler = function() {
        resizer.classList.remove('resizing');
        document.removeEventListener('mousemove', mouseMoveHandler);
        document.removeEventListener('mouseup', mouseUpHandler);
        
        // Restore normal mouse behavior
        document.body.style.userSelect = '';
        document.body.style.cursor = '';
    };

    resizer.addEventListener('mousedown', mouseDownHandler);
</script>

    <script>
        // 1. Initialize Turndown (HTML to MD converter)
        const turndownService = new TurndownService({
            headingStyle: 'atx',      // Use '#' for headings
            codeBlockStyle: 'fenced', // Use '```' for code blocks
            bulletListMarker: '-'     // Use '-' for bullets
        });

        // 2. Initialize Quill (Rich Text Editor)
        const quill = new Quill('#quill-editor', {
            modules: {
                toolbar: '#toolbar-container'
            },
            placeholder: 'Start writing your professional document here...',
            theme: 'snow'
        });

        // DOM Element for output
        const mdOutput = document.getElementById('md-output');

        // 3. Listen for changes in the editor and update Markdown in real-time
        quill.on('text-change', function() {
            // Get the HTML content from Quill
            const htmlContent = quill.root.innerHTML;
            
            // If the editor is empty (Quill leaves a blank <p><br></p>), clear output
            if (htmlContent === '<p><br></p>') {
                mdOutput.value = '';
                return;
            }

            // Convert to Markdown and display
            const markdown = turndownService.turndown(htmlContent);
            mdOutput.value = markdown;
        });

        // 4. Export Functionality
        function exportMarkdown() {
            const mdText = mdOutput.value;
            
            if (!mdText.trim()) {
                alert('The editor is empty. Write something before exporting!');
                return;
            }

            // Create a Blob containing the markdown text
            const blob = new Blob([mdText], { type: 'text/markdown' });
            
            // Create a temporary link element to trigger the download
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'document.md'; // Default file name
            
            // Trigger click and cleanup
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
